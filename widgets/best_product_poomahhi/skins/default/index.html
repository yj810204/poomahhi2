<script>
function bppToggleWishlist(btn){
	var product_srl = btn.getAttribute('data-product-srl');
	if(!product_srl) return;
	jQuery.exec_json('poomahhi.procPoomahhiToggleWishlist', {product_srl: product_srl}, function(ret){
		if(ret.error != 0){ alert(ret.message); return; }
		if(ret.action === 'added'){
			btn.querySelector('i').className = 'ri-heart-fill';
			btn.classList.add('active');
		} else {
			btn.querySelector('i').className = 'ri-heart-line';
			btn.classList.remove('active');
		}
	});
}
</script>
