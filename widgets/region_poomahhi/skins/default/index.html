<script>
(function(){
	var $container = jQuery('.rp-container');
	if(!$container.length) return;
	var mid = $container.attr('data-poomahhi-mid') || '';
	var listCount = $container.attr('data-list-count') || '6';

	jQuery(document).on('click', '.rp-region-item', function(e){
		e.preventDefault();
		var el = e.currentTarget;
		var regionSrl = el.getAttribute('data-region-srl');
		if(!regionSrl) return;
		jQuery('.rp-region-item').removeClass('active');
		jQuery(el).addClass('active');
		jQuery('.rp-main').css('opacity', '0.6');
		jQuery.exec_json('poomahhi.procPoomahhiGetRegionWidgetContent', { region_srl: regionSrl, list_count: listCount, widget_mid: mid }, function(ret){
			jQuery('.rp-main').css('opacity', '1');
			if(ret.error != 0){ alert(ret.message); return; }
			if(ret.html != null) jQuery('.rp-main').html(ret.html);
		});
	});
})();

function rpToggleWishlist(btn){
	var product_srl = btn.getAttribute('data-product-srl');
	if(!product_srl) return;
	jQuery.exec_json('poomahhi.procPoomahhiToggleWishlist', {product_srl: product_srl}, function(ret){
		if(ret.error != 0){ alert(ret.message); return; }
		if(ret.action === 'added'){
			btn.querySelector('i').className = 'ri-heart-fill';
			btn.classList.add('active');
		} else {
			btn.querySelector('i').className = 'ri-heart-line';
			btn.classList.remove('active');
		}
	});
}
</script>
