<script>
(function(){
	var htmlCache = window.__rpRegionHtmlCache || (window.__rpRegionHtmlCache = Object.create(null));
	var reqSeq = 0;

	function cacheKey(mid, listCount, regionSrl){
		return (mid || '') + '\0' + (listCount || '6') + '\0' + regionSrl;
	}

	window.__rpInvalidateRegionWidgetCache = function(){
		for(var k in htmlCache){
			if(Object.prototype.hasOwnProperty.call(htmlCache, k)) delete htmlCache[k];
		}
	};

	jQuery(document).on('click', '.rp-region-item', function(e){
		e.preventDefault();
		var el = e.currentTarget;
		var $c = jQuery(el).closest('.rp-container');
		if(!$c.length) return;
		var regionSrl = el.getAttribute('data-region-srl');
		if(!regionSrl) return;
		if(jQuery(el).hasClass('active')) return;

		var mid = $c.attr('data-poomahhi-mid') || '';
		var listCount = $c.attr('data-list-count') || '6';
		var regionTitle = el.getAttribute('data-region-title') || '';
		var $main = $c.find('.rp-main').first();
		if(!$main.length) return;

		$c.find('.rp-region-item').removeClass('active');
		jQuery(el).addClass('active');

		var ck = cacheKey(mid, listCount, regionSrl);
		if(htmlCache[ck]){
			$main.html(htmlCache[ck]);
			return;
		}

		var mySeq = ++reqSeq;
		jQuery.exec_json('poomahhi.procPoomahhiGetRegionWidgetContent', {
			region_srl: regionSrl,
			list_count: listCount,
			widget_mid: mid,
			region_title: regionTitle
		}, function(ret){
			if(mySeq !== reqSeq) return;
			if(ret.error != 0){ alert(ret.message); return; }
			if(ret.html != null){
				htmlCache[ck] = ret.html;
				$main.html(ret.html);
			}
		});
	});
})();

function rpToggleWishlist(btn){
	var product_srl = btn.getAttribute('data-product-srl');
	if(!product_srl) return;
	jQuery.exec_json('poomahhi.procPoomahhiToggleWishlist', {product_srl: product_srl}, function(ret){
		if(ret.error != 0){ alert(ret.message); return; }
		if(window.__rpInvalidateRegionWidgetCache) window.__rpInvalidateRegionWidgetCache();
		if(ret.action === 'added'){
			btn.querySelector('i').className = 'ri-heart-fill';
			btn.classList.add('active');
		} else {
			btn.querySelector('i').className = 'ri-heart-line';
			btn.classList.remove('active');
		}
	});
}
</script>
