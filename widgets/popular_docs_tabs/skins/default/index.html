	<div class="pdt-tabs">

	</div>

<script>
(function(){
	var $w = jQuery('.pdt-widget');
	if(!$w.length) return;
	var listCount = $w.attr('data-list-count') || '10';
	var widgetName = $w.attr('data-widget') || 'popular_docs_tabs';
	var widgetSkin = $w.attr('data-widget-skin') || 'default';
	var b1 = $w.attr('data-board-1-module-srl') || '0';
	var b2 = $w.attr('data-board-2-module-srl') || '0';
	var b3 = $w.attr('data-board-3-module-srl') || '0';
	jQuery(document).on('click', '.pdt-tab', function(e){
		e.preventDefault();
		var tab = jQuery(this).data('tab');
		if(!tab) return;
		jQuery('.pdt-tab').removeClass('active');
		jQuery(this).addClass('active');
		jQuery('.pdt-content').css('opacity', '0.5');
		jQuery.exec_json('poomahhi.procPoomahhiGetPopularDocsTabContent', {
			tab: tab,
			list_count: listCount,
			pdt_widget: widgetName,
			pdt_skin: widgetSkin,
			board_1_module_srl: b1,
			board_2_module_srl: b2,
			board_3_module_srl: b3
		}, function(ret){
			jQuery('.pdt-content').css('opacity', '1');
			if(ret.error != 0){ alert(ret.message); return; }
			if(ret.html != null) jQuery('.pdt-content').html(ret.html);
		});
	});
})();
</script>

<script>
	$(".more_btn").on('click', function(){
		$(this).closest('.pdt-widget').toggleClass('on');
	});
</script>
