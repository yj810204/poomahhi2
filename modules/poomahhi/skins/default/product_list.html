<script>
function toggleWishlist(btn){
	var product_srl = btn.getAttribute('data-product-srl');
	if(!product_srl) return;

	jQuery.exec_json('poomahhi.procPoomahhiToggleWishlist', {product_srl: product_srl}, function(ret){
		if(ret.error != 0){
			alert(ret.message);
			return;
		}
		if(ret.action === 'added'){
			btn.innerHTML = '<i class="ri-heart-fill"></i>';
			btn.classList.add('active');
		} else {
			btn.innerHTML = '<i class="ri-heart-line"></i>';
			btn.classList.remove('active');
		}
	});
}
</script>
