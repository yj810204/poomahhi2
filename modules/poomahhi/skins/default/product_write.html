<script>
jQuery(function($){
	$('#productWriteForm').on('submit', function(e){
		e.preventDefault();
		var editorContent = '';
		try {
			var editorIframes = $('#editorWrapper iframe');
			if(editorIframes.length > 0){
				editorIframes.each(function(){
					try {
						var iframeDoc = this.contentDocument || this.contentWindow.document;
						var body = $(iframeDoc).find('body');
						if(body.length > 0) editorContent = body.html();
					} catch(err){}
				});
			}
			if(!editorContent && typeof CKEDITOR !== 'undefined'){
				for(var instance in CKEDITOR.instances){
					if(CKEDITOR.instances.hasOwnProperty(instance)){
						editorContent = CKEDITOR.instances[instance].getData();
						break;
					}
				}
			}
			if(!editorContent){
				var editableDiv = $('#editorWrapper .xe_content[contenteditable], #editorWrapper [contenteditable="true"]');
				if(editableDiv.length > 0) editorContent = editableDiv.html();
			}
			if(!editorContent){
				var editorTextarea = $('#editorWrapper textarea[name="content"]');
				if(editorTextarea.length > 0 && editorTextarea.val()) editorContent = editorTextarea.val();
			}
		} catch(err){}
		$('#content_hidden').val(editorContent);
		$('#editorWrapper textarea[name="content"], #editorWrapper input[name="content"]').removeAttr('name');
		this.submit();
	});

	$('#extraTemplateSelect').on('change', function(){
		var template_srl = $(this).val();
		var container = $('#extraVarsContainer');
		if(!template_srl){ container.html(''); return; }
		$.exec_json('poomahhi.procPoomahhiGetExtraDefsByTemplate', {template_srl: template_srl}, function(ret){
			if(ret.error != 0){ alert(ret.message); return; }
			var defs = ret.extra_defs || [];
			if(!defs.length){ container.html('<p class="pmh-empty-msg">선택한 템플릿에 등록된 확장변수가 없습니다.</p>'); return; }
			var html = '';
			for(var i = 0; i < defs.length; i++){
				var def = defs[i];
				var req = (def.is_required === 'Y');
				var reqAttr = req ? ' required="required"' : '';
				var reqClass = req ? ' req' : '';
				html += '<div class="pmh-field"><label class="pmh-label' + reqClass + '">' + def.var_label + '</label>';
				if(def.var_type === 'textarea'){
					html += '<textarea name="extra_' + def.var_name + '" class="pmh-textarea" rows="4"' + reqAttr + '></textarea>';
				} else if(def.var_type === 'number'){
					html += '<input type="number" name="extra_' + def.var_name + '" class="pmh-input pmh-input-half"' + reqAttr + ' />';
				} else if(def.var_type === 'date'){
					html += '<input type="date" name="extra_' + def.var_name + '" class="pmh-input pmh-input-half"' + reqAttr + ' />';
				} else if(def.var_type === 'select' && def.var_options){
					html += '<select name="extra_' + def.var_name + '" class="pmh-input"' + reqAttr + '><option value="">-- 선택 --</option>';
					var opts = def.var_options.split(',');
					for(var j = 0; j < opts.length; j++) html += '<option value="' + opts[j].trim() + '">' + opts[j].trim() + '</option>';
					html += '</select>';
				} else {
					html += '<input type="text" name="extra_' + def.var_name + '" class="pmh-input"' + reqAttr + ' />';
				}
				html += '</div>';
			}
			container.html(html);
		});
	});
});

function previewImage(input){
	if(input.files && input.files[0]){
		var reader = new FileReader();
		reader.onload = function(e){
			var area = document.getElementById('imageUploadArea');
			area.innerHTML = '<div class="pmh-image-preview" id="imagePreview"><img src="' + e.target.result + '" alt="" /><button type="button" class="pmh-image-remove" onclick="removeImage();">X</button></div>' + '<input type="file" name="product_image" id="productImageInput" accept="image/*" style="display:none;" onchange="previewImage(this);" /><input type="hidden" name="delete_product_image" id="deleteImageFlag" value="" />';
		};
		reader.readAsDataURL(input.files[0]);
	}
}
function removeImage(){
	var area = document.getElementById('imageUploadArea');
	area.innerHTML = '<div class="pmh-image-placeholder" id="imagePlaceholder" onclick="document.getElementById(\'productImageInput\').click();"><span class="pmh-placeholder-plus">+</span></div><input type="file" name="product_image" id="productImageInput" accept="image/*" style="display:none;" onchange="previewImage(this);" /><input type="hidden" name="delete_product_image" id="deleteImageFlag" value="Y" />';
}
</script>
