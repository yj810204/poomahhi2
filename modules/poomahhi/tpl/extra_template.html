<script>
(function(){
	var tbody = document.getElementById('templateSortBody');
	if(!tbody) return;
	var dragRow = null;
	tbody.querySelectorAll('tr').forEach(function(row){
		row.setAttribute('draggable', 'true');
		row.addEventListener('dragstart', function(e){
			dragRow = this; this.style.opacity = '0.4';
			e.dataTransfer.effectAllowed = 'move';
		});
		row.addEventListener('dragend', function(){
			this.style.opacity = '1';
			tbody.querySelectorAll('tr').forEach(function(r){ r.classList.remove('drag-over'); });
			dragRow = null;
		});
		row.addEventListener('dragover', function(e){
			e.preventDefault(); e.dataTransfer.dropEffect = 'move';
			if(this !== dragRow) this.classList.add('drag-over');
		});
		row.addEventListener('dragleave', function(){ this.classList.remove('drag-over'); });
		row.addEventListener('drop', function(e){
			e.preventDefault(); this.classList.remove('drag-over');
			if(dragRow && dragRow !== this){
				var rows = Array.from(tbody.querySelectorAll('tr'));
				var fromIdx = rows.indexOf(dragRow), toIdx = rows.indexOf(this);
				if(fromIdx < toIdx) tbody.insertBefore(dragRow, this.nextSibling);
				else tbody.insertBefore(dragRow, this);
				var srls = [];
				tbody.querySelectorAll('tr').forEach(function(r){ srls.push(r.getAttribute('data-template-srl')); });
				jQuery.exec_json('poomahhi.procPoomahhiAdminSortExtraTemplates', {template_srls: srls.join(',')}, function(ret){
					if(ret.error != 0) alert(ret.message);
				});
			}
		});
	});
})();
</script>
