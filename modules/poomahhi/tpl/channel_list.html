<!--@if($channel_list)-->
<table class="table table-bordered table-hover pmh-admin-sortable" id="channelSortTable" style="width:100%; table-layout:auto;">
	<thead>
		<tr>
			<th style="width:40px;"></th>
			<th style="width:60px;">순번</th>
			<th>쇼핑채널</th>

		</tr>

	<tbody id="channelSortBody">
		<!--@foreach($channel_list as $c)-->
		<tr data-channel-srl="{$c->channel_srl}">
			<td class="pmh-admin-drag-handle" style="text-align:center; color:#999;">&#9776;</td>

			</td>
		</tr>
		<!--@end-->
	</tbody>
</table>

<script>
(function(){
	var tbody = document.getElementById('channelSortBody');
	if(!tbody) return;

	var dragRow = null;

	tbody.querySelectorAll('tr').forEach(function(row){
		row.setAttribute('draggable', 'true');

		row.addEventListener('dragstart', function(e){
			dragRow = this;
			this.style.opacity = '0.4';
			e.dataTransfer.effectAllowed = 'move';
		});

		row.addEventListener('dragend', function(){
			this.style.opacity = '1';
			tbody.querySelectorAll('tr').forEach(function(r){ r.classList.remove('drag-over'); });
			dragRow = null;
		});

		row.addEventListener('dragover', function(e){
			e.preventDefault();
			e.dataTransfer.dropEffect = 'move';
			if(this !== dragRow) this.classList.add('drag-over');
		});

		row.addEventListener('dragleave', function(){
			this.classList.remove('drag-over');
		});

		row.addEventListener('drop', function(e){
			e.preventDefault();
			this.classList.remove('drag-over');
			if(dragRow && dragRow !== this){
				var rows = Array.from(tbody.querySelectorAll('tr'));
				var fromIdx = rows.indexOf(dragRow);
				var toIdx = rows.indexOf(this);
				if(fromIdx < toIdx){
					tbody.insertBefore(dragRow, this.nextSibling);
				} else {
					tbody.insertBefore(dragRow, this);
				}
				saveOrder();
			}
		});
	});

	function saveOrder(){
		var srls = [];
		tbody.querySelectorAll('tr').forEach(function(r){
			srls.push(r.getAttribute('data-channel-srl'));
		});
		jQuery.exec_json('poomahhi.procPoomahhiAdminSortChannels', {channel_srls: srls.join(',')}, function(ret){
			if(ret.error != 0) alert(ret.message);
		});
	}
})();
</script>
